<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Operators</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .card h2 {
            margin-top: 0;
            color: #1e293b;
        }

        .card input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .card input[type="text"]:focus {
            border-color: #4f46e5;
        }

        .card input[type="button"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .card input[type="button"]:hover {
            background: #4338ca;
        }

        #output {
            margin-top: 18px;
            font-weight: bold;
            color: #0f172a;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        nav a {
            color: #1e293b;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
        }

        nav a:hover {
            border-color: #4f46e5;
            color: #4f46e5;
        }

        nav a.active {
            background: #4f46e5;
            border-color: #4f46e5;
            color: white;
        }

    </style>
</head>

<body>
    <nav>
    <a href="index.html">Homepage</a>
    <a href="element_checker.html">Element Checker</a>
    <a href="club_members.html" class="active">School Club Members</a>
    <a href="meet_the_creator.html">Meet the Creator</a>
    </nav>
    <div class="card">
        <h2>OBMC ICT Club</h2>
        <input type="text" id="student_name_first" placeholder="Enter first name">
        <input type="text" id="student_name_last" placeholder="Enter last name">
        <input type="button" py-click="student_name" value="Search">

        <div id="output"></div>
    </div>

    <script type="py" src="main3.py"></script>
</body>
</html>
