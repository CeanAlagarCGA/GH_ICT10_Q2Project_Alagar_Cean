<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet the Creator</title>
<link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
<style>
body{
  margin:0; min-height:100vh; color:#fff;
  font-family:system-ui,"Segoe UI",Arial,sans-serif;
  background-color:#111;
  background-image:
    linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.75)),
    url("https://img.magnific.com/premium-photo/race-track-perspective-with-checkered-flag_1410957-96411.jpg?semt=ais_hybrid&w=740&q=80");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}
#output{
  max-width:560px; margin:48px auto 96px; padding:56px 32px 32px;
  position:relative; background:rgba(0,0,0,.72); border-radius:8px;
  line-height:1.7; font-size:1.05rem;
}
#output::before{
  content:""; position:absolute; top:0; left:0; right:0; height:16px;
  border-radius:8px 8px 0 0;
  background:repeating-conic-gradient(#fff 0 25%, #000 0 50%) 0 0 / 16px 16px;
}

#output div:nth-child(1){color:#ff3b30; text-transform:uppercase; letter-spacing:2px; font-size:.9rem; font-weight:bold}
#output div:nth-child(2){font-size:2.2rem; font-weight:800; line-height:1.2}
#output div:nth-child(3){color:#ccc; margin-bottom:24px}
#output div:nth-child(4), #output div:nth-child(6),
#output div:nth-child(8), #output div:nth-child(10){
  margin-top:20px; color:#ff3b30; text-transform:uppercase;
  letter-spacing:2px; font-size:.9rem; font-weight:bold;
}
#output div:nth-child(12){
  margin-top:28px; padding:16px 20px; font-style:italic;
  background:rgba(255,255,255,.1); border-left:4px solid #e10600;
}

nav{
  position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap;
  justify-content:center; gap:8px; padding:12px 20px;
  background-color:#1a1a1a; border-bottom:1px solid #333;
  box-shadow:0 4px 12px rgba(0,0,0,.4); font-family:Arial,sans-serif;
}
nav a{
  color:white; text-decoration:none; font-size:14px; letter-spacing:1px;
  padding:8px 16px; background-color:#292929; border:1px solid #444;
  border-radius:4px;
}
nav a:hover{background-color:#c62828; border-color:#c62828}
nav a.active{background-color:#a71930; border-color:#a71930
}


</style>
</head>

    <a href="club_members.html">School Club Members</a>

  </nav>

</body>
</html>
